<!DOCTYPE html>
<html>
  <head>
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">

  </head>
  <body style="background-color:#00A7E1;">

    <!-- SideBar -->
    <div class="sidebar">
      <center>
        <h1 style="color:#EBEBEB">Jack Usher</h1>
        <a href="#">Portfolio</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">4th Option</a>
      </center>
    </div>

    <!-- Page Content -->
    <div class="main">
      <center>
        <!--Title & links-->
        <h1 style="color:#EBEBEB;">Portfolio</h1>
        <a href="https://jackmygooman.itch.io/" style="color:#FFA630;"> <b><img src="/images/Itch/itchio-logo-textless-black.png" width="28" height="25" alt="Itch Logo"></b></a>
        <a href="" style="color:#FFA630;"> <b><img src="\images\LinkedIn\LI-In-Bug.png" width="29" height="25" alt="LinkedIn Logo"></b></a>
        <h2 style="color:#EBEBEB;">Featured Piece</h2>
      </center> 

      <!-- Slideshow container -->
      <div class="slideshow-container">

        <!-- Full-width images with number and caption text -->
        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="\images\Test\images.jpg" style="width:100%">
            <div class="text">Caption Text</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="\images\Test\FlatMichaelappreciationpage.png" style="width:100%">
            <div class="text">Caption Two</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">3 / 3</div>
            <img src="\images\Test\images1.jpg" style="width:100%">
            <div class="text">Caption Three</div>
        </div>

        <!-- Next and previous buttons -->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        <br>

        <!-- The dots/circles -->
        <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
        </div>
      <script src="script.js"></script>
    </div>
  </body>
</html>
